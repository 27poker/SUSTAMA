 return h+'</div>'}
function renderHome(){var stage=getStage(S.pet.xp),pct=stage.max?Math.round((S.pet.xp-stage.min)/(stage.max-stage.min)*100):100,today=todayStr(),creatina=S.dailyCap.lastCreatineDate===today,done=S.dailyCap.lastRoutineDate===today,st=Math.round(S.stamina),focus=FOCUS_META[S.pet.focus];var h=shellTop()+'<div class="screen">';
 h+='<div class="pet-stage" id="petStage"><div class="pet-name-row"><span class="pet-name">'+escapeHtml(S.pet.name)+'</span><span class="pet-stage-label">'+stage.name.toUpperCase()+'</span></div><div class="pet-canvas'+(UI.act?' act-'+UI.act:'')+'" id="petCanvas" data-action="petInteract" title="Toca a tu mascota">'+petVisual(UI.act||'idle',!!UI.act)+'<div class="equip-badge" title="'+escapeHtml(equipLabel(S.pet.focus,stage.level))+'">'+svgEquipment(S.pet.focus,stage.level)+'</div></div><div style="width:100%"><div class="xp-bar-track"><div class="xp-bar-fill" style="width:'+pct+'%"></div></div><div class="xp-caption"><span>'+S.pet.xp+' XP</span><span>'+(stage.max?'Próximo: '+stage.max+' XP':'Nivel máximo')+'</span></div></div>'+(S.theme==='retro'?'<div class="retro-hint">Toca la mascota para una reacción</div>':'')+'</div>';
 h+='<div class="card" style="display:flex;flex-direction:column;gap:14px"><div class="stamina-row">'+shaker(st)+'<div class="stamina-meta"><div class="stamina-label">ESTAMINA</div><div class="shaker-pct">'+st+'%</div>'+(st<30?'<div class="stamina-warn">Tu mascota necesita entrenar pronto</div>':'')+'</div></div><div class="action-grid"><button class="action-btn" data-action="freeAction" data-act="gimnasio">'+ICN.dumbbell+'<span>Hacer Pesas</span></button><button class="action-btn" data-action="freeAction" data-act="running">'+ICN.run+'<span>Hacer Cardio</span></button><button class="action-btn" data-action="freeAction" data-act="rest">'+ICN.rest+'<span>Descansar</span></button></div><button class="creatina-btn" data-action="useCreatina" '+(creatina?'disabled':'')+'>'+ICN.bolt+(creatina?'00 ya tomada hoy':'Tomar 00 (Creatina)')+'</button><div class="cap-note">'+(done?'Rutina de hoy completada — vuelve mañana.':'Completa una rutina para obtener XP y recargar la Estamina.')+'</div><div class="status-chip"><span>Enfoque:</span><b>'+escapeHtml(focus.label)+'</b></div></div>';
 h+='<div class="shelf"><div class="shelf-item">'+ICN.capsule+'<span>01</span><small>Próximamente</small></div><div class="shelf-item">'+ICN.capsule+'<span>02</span><small>Próximamente</small></div></div></div>'+shellBottom('home');return h}
function routineTabs(){return'<div class="pill-row">'+S.routines.map(function(r,i){return'<button class="pill'+(UI.routineId===r.id?' active':'')+'" data-action="setRoutine" data-rid="'+r.id+'">Día '+(i+1)+'</button>'}).join('')+'<button class="pill" data-action="addRoutine">'+ICN.plus+' Añadir día</button></div>'}
function renderRoutineEditor(r){return'<div class="routine-editor"><div class="modal-grid"><div><label style="display:block;font-size:10px;color:var(--text-dim);margin-bottom:4px">Nombre</label><input class="field" data-action="editRoutineField" data-field="titulo" data-rid="'+r.id+'" value="'+escapeHtml(r.titulo)+'"></div><div><label style="display:block;font-size:10px;color:var(--text-dim);margin-bottom:4px">Descripción</label><input class="field" data-action="editRoutineField" data-field="sub" data-rid="'+r.id+'" value="'+escapeHtml(r.sub)+'"></div></div><div style="display:flex;gap:8px"><button class="btn btn-sm" data-action="moveRoutine" data-rid="'+r.id+'" data-dir="up">'+ICN.up+' Subir</button><button class="btn btn-sm" data-action="moveRoutine" data-rid="'+r.id+'" data-dir="down">'+ICN.down+' Bajar</button></div></div>'}
function renderRutinas(){if(!UI.routineId||!getRoutine(UI.routineId))UI.routineId=S.routines[0]&&S.routines[0].id;var r=getRoutine(UI.routineId),today=todayStr(),done=S.dailyCap.lastRoutineDate===today;var h=shellTop()+'<div class="screen"><div><h2>Rutinas</h2><p style="font-size:12px">Crea y modifica tus días de entrenamiento como quieras.</p></div>'+routineTabs();
 if(!r){h+='<div class="card routine-empty">No tienes rutinas todavía.<br><br><button class="btn btn-primary btn-sm" data-action="addRoutine">Crear primera rutina</button></div></div>'+shellBottom('rutinas');return h}
 h+='<div class="card" style="display:flex;flex-direction:column;gap:14px"><div class="routine-head"><div><div class="routine-title">'+escapeHtml(r.titulo)+'</div><div class="routine-sub">'+escapeHtml(r.sub)+'</div></div><div class="routine-tools"><button class="icon-btn" data-action="toggleEditRoutine" data-rid="'+r.id+'" title="Editar rutina">'+ICN.edit+'</button><button class="icon-btn" data-action="deleteRoutine" data-rid="'+r.id+'" title="Eliminar rutina">'+ICN.trash+'</button></div></div>'+ (UI.editRoutineId===r.id?renderRoutineEditor(r):'');
 h+='<div class="exercise-list">';if(!r.ejercicios.length)h+='<div class="routine-empty">Esta rutina todavía no tiene ejercicios.</div>';
 r.ejercicios.forEach(function(ex,idx){var open=!!UI.openHist[ex.id];h+='<div class="ex-card"><div class="ex-head"><input class="field ex-title-input" data-action="setExerciseName" data-rid="'+r.id+'" data-exid="'+ex.id+'" value="'+escapeHtml(ex.nombre)+'"><button class="icon-btn" data-action="removeEx" data-rid="'+r.id+'" data-exid="'+ex.id+'" title="Eliminar ejercicio">'+ICN.trash+'</button></div><div class="ex-inputs"><div class="ex-field"><label>Series</label><input type="number" min="0" inputmode="numeric" value="'+ex.series+'" data-action="setExercise" data-rid="'+r.id+'" data-exid="'+ex.id+'" data-field="series"></div><div class="ex-field"><label>Repeticiones</label><input type="number" min="0" inputmode="numeric" value="'+ex.reps+'" data-action="setExercise" data-rid="'+r.id+'" data-exid="'+ex.id+'" data-field="reps"></div><div class="ex-field"><label>Peso (kg)</label><input type="number" min="0" step="0.5" inputmode="decimal" value="'+ex.peso+'" data-action="setExercise" data-rid="'+r.id+'" data-exid="'+ex.id+'" data-field="peso"></div></div><div class="ex-foot">'+(ex.historial.length?'<button class="ex-hist-toggle" data-action="toggleHist" data-exid="'+ex.id+'">'+(open?'Ocultar historial':'Ver historial ('+ex.historial.length+')')+'</button>':'<span style="font-size:10px;color:var(--text-dim)">Sin historial todavía</span>')+'<div class="move-group"><button class="icon-btn" data-action="moveEx" data-rid="'+r.id+'" data-exid="'+ex.id+'" data-dir="up" aria-label="Subir">'+ICN.up+'</button><button class="icon-btn" data-action="moveEx" data-rid="'+r.id+'" data-exid="'+ex.id+'" data-dir="down" aria-label="Bajar">'+ICN.down+'</button></div></div>'+(open?'<div class="ex-hist open">'+ex.historial.slice().reverse().slice(0,10).map(function(x){return'<div class="ex-hist-row"><span>'+fmtDate(x.fecha)+'</span><span>'+x.peso+' kg</span></div>'}).join('')+'</div>':'')+'</div>'});
 h+='</div><button class="add-ex-btn" data-action="addEx" data-rid="'+r.id+'">'+ICN.plus+' Añadir ejercicio</button><button class="btn btn-primary btn-block" data-action="completeRoutine" data-rid="'+r.id+'" '+(done?'disabled':'')+'>'+ICN.check+(done?'Rutina completada hoy':'Marcar rutina como completada')+'</button><div class="cap-note">Solo una rutina puede otorgar la recompensa diaria de XP y Estamina.</div></div>';
 h+='<div class="card progress-card"><div><h2>Progresión</h2><p style="font-size:11px">Historial de peso registrado en esta rutina.</p></div>'+renderProgress(r)+'</div></div>'+shellBottom('rutinas');return h}
function renderProgress(r){var rows=[];r.ejercicios.forEach(function(ex){var hs=ex.historial||[];if(hs.length){var first=hs[0].peso,last=hs[hs.length-1].peso,delta=last-first;rows.push('<div class="history-row"><span>'+escapeHtml(ex.nombre)+'</span><span>'+last+' kg</span><span class="'+(delta>0?'history-positive':'')+'">'+(delta>0?'+':'')+delta+' kg</span></div>')}});if(!rows.length)return'<div style="font-size:11px;color:var(--text-dim)">Completa la rutina para comenzar a construir historial.</div>';return'<div class="history-row history-head"><span>Ejercicio</span><span>Último</span><span>Cambio</span></div>'+rows.join('')}
function renderCalendario(){var h=shellTop()+'<div class="screen"><div><h2>Calendario de Consistencia</h2><p style="font-size:12px">Cada cuadro representa una rutina completada.</p></div>';var streak=computeStreakWeeks();h+='<div class="card streak-card"><div class="streak-icon">'+ICN.bolt+'</div><div><div class="streak-num">Racha: '+streak+' semana'+(streak===1?'':'s')+' consecutiva'+(streak===1?'':'s')+'</div><div class="streak-sub">Constancia, sin atajos.</div></div></div><div class="card"><div class="heat-scroll"><div class="heat-grid">'+buildHeatCells()+'</div></div><div class="heat-legend" style="margin-top:8px"><span>Menos</span><span class="heat-cell"></span><span class="heat-cell filled"></span><span>Más</span></div></div>';
 var total=Object.keys(S.routineLog).length;h+='<div class="stat-grid"><div class="stat-box"><b>'+total+'</b><span>Rutinas totales</span></div><div class="stat-box"><b>'+S.pet.xp+'</b><span>XP acumulada</span></div></div>';
 var recent=Object.keys(S.routineLog).sort().reverse().slice(0,8);h+='<div class="card progress-card"><div><h2>Últimos entrenamientos</h2></div>'+ (recent.length?recent.map(function(ds){var log=S.routineLog[ds];return'<div class="history-row"><span>'+fmtDate(ds)+'</span><span>'+escapeHtml(log&&log.titulo?log.titulo:'Rutina')+'</span><span>'+(''+(log&&log.xp?log.xp:XP_PER_ROUTINE))+' XP</span></div>'}).join(''):'<div style="font-size:11px;color:var(--text-dim)">Todavía no hay registros.</div>')+'</div></div>'+shellBottom('calendario');return h}
function buildHeatCells(){var weeks=18,end=new Date();end.setDate(end.getDate()+7);var start=new Date(end);start.setDate(start.getDate()-weeks*7);var s='',cursor=new Date(start);for(var i=0;i<weeks*7;i++){var ds=dateKey(cursor),future=cursor>new Date(),filled=!!S.routineLog[ds];s+='<div class="heat-cell'+(filled?' filled':'')+'"'+(future?' style="opacity:.22"':'')+' title="'+ds+'"></div>';cursor.setDate(cursor.getDate()+1)}return s}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function getMonday(d){var dt=new Date(d);var day=dt.getDay();var diff=day===0?-6:1-day;dt.setDate(dt.getDate()+diff);dt.setHours(0,0,0,0);return dt}
function computeStreakWeeks(){var weeks={};Object.keys(S.routineLog).forEach(function(ds){var d=new Date(ds+'T00:00:00');weeks[dateKey(getMonday(d))]=true});var count=0,cursor=getMonday(new Date());if(!weeks[dateKey(cursor)]){var yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);cursor=getMonday(yesterday);if(!weeks[dateKey(cursor)])return 0}while(weeks[dateKey(cursor)]){count++;cursor.setDate(cursor.getDate()-7)}return count}
function render(){document.body.className='theme-'+S.theme;var app=document.getElementById('app');if(!S.onboarded)app.innerHTML=renderOnboarding();else if(UI.screen==='rutinas')app.innerHTML=renderRutinas();else if(UI.screen==='calendario')app.innerHTML=renderCalendario();else app.innerHTML=renderHome()}
function toast(msg){var w=document.getElementById('toastWrap');w.innerHTML='<div class="toast" id="toastEl">'+msg+'</div>';var e=document.getElementById('toastEl');requestAnimationFrame(function(){e.classList.add('show')});clearTimeout(window.__toast);window.__toast=setTimeout(function(){e.classList.remove('show')},2600)}
function tickStaminaDecay(){var now=Date.now(),last=S.staminaCheckedAt||now,hoursSinceTrain=S.lastTrainedAt?(now-S.lastTrainedAt)/3600000:Infinity;if(hoursSinceTrain>24){var hours=(now-last)/3600000;S.stamina=clamp(S.stamina-hours*(15/24),0,100)}S.staminaCheckedAt=now}
function playAct(act,ms){UI.act=act;render();setTimeout(function(){if(UI.act===act){UI.act='';render()}},ms||ANIM_MS[act]||1200)}
function freeAction(kind){var anim=kind==='rest'?'rest':kind;playAct(anim,ANIM_MS[anim]);var msg=kind==='gimnasio'?'Tu mascota se puso a levantar pesas. La XP real se obtiene al completar una rutina.':kind==='running'?'Buen ritmo. Esta interacción es libre y no da XP.':'Momento de descanso. La Estamina se recarga al completar tu rutina.';toast(msg)}
function useCreatina(){var today=todayStr();if(S.dailyCap.lastCreatineDate===today)return;S.stamina=clamp(S.stamina+30,0,100);S.dailyCap.lastCreatineDate=today;saveState();playAct('creatina',ANIM_MS.creatina);toast('00 activada: +30% de Estamina.')}
function completeRoutine(rid){var today=todayStr();if(S.dailyCap.lastRoutineDate===today){toast('La recompensa de entrenamiento de hoy ya fue utilizada.');return}var r=getRoutine(rid);if(!r)return;r.ejercicios.forEach(function(ex){ex.historial.push({fecha:today,peso:Number(ex.peso)||0})});var prev=getStage(S.pet.xp).level;S.dailyCap.lastRoutineDate=today;S.routineLog[today]={routineId:r.id,titulo:r.titulo,xp:XP_PER_ROUTINE};S.stamina=100;S.lastTrainedAt=Date.now();S.staminaCheckedAt=Date.now();S.pet.xp+=XP_PER_ROUTINE;var next=getStage(S.pet.xp).level;saveState();UI.screen='home';playAct(FOCUS_META[S.pet.focus].anim,1900);if(next>prev)setTimeout(function(){playAct('levelup',1200);toast('Tu mascota evolucionó a '+getStage(S.pet.xp).name+'.')},1900);else toast('Rutina completada: +'+XP_PER_ROUTINE+' XP y Estamina al 100%.')}
function findEx(rid,eid){var r=getRoutine(rid);return r&&r.ejercicios.find(function(e){return e.id===eid})}
function move(arr,id,dir){var i=arr.findIndex(function(x){return x.id===id});if(i<0)return;var j=dir==='up'?i-1:i+1;if(j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t}
function addRoutine(){var r={id:uid('routine'),titulo:'Nueva rutina',sub:'Entrenamiento personalizado',ejercicios:[exercise('Nuevo ejercicio')]};S.routines.push(r);UI.routineId=r.id;UI.editRoutineId=r.id;saveState();render();toast('Nueva rutina creada.')}
function deleteRoutine(rid){var r=getRoutine(rid);if(!r)return;var ok=confirm('¿Eliminar "'+r.titulo+'"?\n\nTambién se eliminará su configuración e historial asociado.');if(!ok)return;S.routines=S.routines.filter(function(x){return x.id!==rid});UI.routineId=(S.routines[0]&&S.routines[0].id)||null;UI.editRoutineId=null;saveState();render();toast('Rutina eliminada.')}
function addExercise(rid){var r=getRoutine(rid);if(!r)return;r.ejercicios.push(exercise('Nuevo ejercicio'));saveState();render();toast('Ejercicio añadido.')}
function removeExercise(rid,eid){var r=getRoutine(rid);if(!r)return;var ex=findEx(rid,eid);if(!ex)return;if(!confirm('¿Eliminar "'+ex.nombre+'"?'))return;r.ejercicios=r.ejercicios.filter(function(x){return x.id!==eid});saveState();render();}
function attach(){var app=document.getElementById('app');app.addEventListener('click',function(e){var t=e.target.closest('[data-action]');if(!t)return;var a=t.dataset.action;
 if(a==='nav'){UI.screen=t.dataset.screen;render();return}if(a==='toggleTheme'){document.getElementById('themePop').classList.toggle('open');return}if(a==='setTheme'){S.theme=t.dataset.theme;saveState();render();return}
 if(a==='onbNext'){if(UI.onbStep===1){var v=(document.getElementById('petNameInput').value||'').trim();if(!v){toast('Ponle un nombre a tu mascota primero.');return}UI.onbName=v}UI.onbStep=Math.min(3,UI.onbStep+1);render();return}if(a==='onbBack'){UI.onbStep=Math.max(1,UI.onbStep-1);render();return}if(a==='pickType'){UI.onbType=t.dataset.type;render();return}if(a==='pickFocus'){UI.onbFocus=t.dataset.focus;render();return}if(a==='onbFinish'){S.pet.name=UI.onbName;S.pet.type=UI.onbType;S.pet.focus=UI.onbFocus;S.onboarded=true;saveState();UI.screen='home';render();toast('Tu mascota está lista.');return}
 if(a==='freeAction'){freeAction(t.dataset.act);return}if(a==='useCreatina'){useCreatina();return}if(a==='petInteract'){playAct('interact',ANIM_MS.interact);return}
 if(a==='setRoutine'){UI.routineId=t.dataset.rid;UI.editRoutineId=null;render();return}if(a==='addRoutine'){addRoutine();return}if(a==='toggleEditRoutine'){UI.editRoutineId=UI.editRoutineId===t.dataset.rid?null:t.dataset.rid;render();return}if(a==='deleteRoutine'){deleteRoutine(t.dataset.rid);return}if(a==='moveRoutine'){var rr=getRoutine(t.dataset.rid);move(S.routines,t.dataset.rid,t.dataset.dir);saveState();render();return}
 if(a==='addEx'){addExercise(t.dataset.rid);return}if(a==='removeEx'){removeExercise(t.dataset.rid,t.dataset.exid);return}if(a==='moveEx'){var r=getRoutine(t.dataset.rid);move(r.ejercicios,t.dataset.exid,t.dataset.dir);saveState();render();return}if(a==='toggleHist'){UI.openHist[t.dataset.exid]=!UI.openHist[t.dataset.exid];render();return}if(a==='completeRoutine'){completeRoutine(t.dataset.rid);return}
 });
 app.addEventListener('input',function(e){var t=e.target;if(t.dataset.action==='setExerciseName'){var ex=findEx(t.dataset.rid,t.dataset.exid);if(ex){ex.nombre=t.value;saveState()}}if(t.dataset.action==='editRoutineField'){var r=getRoutine(t.dataset.rid);if(r){r[t.dataset.field]=t.value;saveState()}}});
 app.addEventListener('change',function(e){var t=e.target;if(t.dataset.action==='setExercise'){var ex=findEx(t.dataset.rid,t.dataset.exid);if(ex){ex[t.dataset.field]=Number(t.value)||0;saveState()}}});
 document.addEventListener('click',function(e){if(!e.target.closest('.theme-switch')){var p=document.getElementById('themePop');if(p)p.classList.remove('open')}})
}
function init(){S=loadState();UI.routineId=S.routines[0]&&S.routines[0].id;tickStaminaDecay();saveState();attach();render();setInterval(function(){tickStaminaDecay();saveState();if(S.onboarded&&UI.screen==='home')render()},60000)}
document.addEventListener('DOMContentLoaded',init);
})();
</script>
