function modes(){$('modes').innerHTML='';['light','dark','retro'].forEach(t=>{const b=btn($('modes'),MODE_ICON[t],()=>setTheme(t));b.title={light:'Claro',dark:'Oscuro',retro:'Retro LCD'}[t];b.classList.toggle('on',t==TN)})}
$('rst').onclick=()=>{if(confirm('¿Borrar todo el progreso y crear una mascota nueva?')){localStorage.removeItem(KEY);location.reload()}};
/* ===== MIGRATE repo v2/v1 data (name, xp, energy, routines, loads, logs) ===== */
function migrate(){try{const o=JSON.parse(localStorage.getItem('laSustanciaGymPet_v2')||localStorage.getItem('laSustanciaGymPet_v1')||'null');if(!o||!o.pet)return;
  G.name=o.pet.name||G.name;G.xp=+o.pet.xp||0;G.energy=o.stamina!=null?+o.stamina:100;G.onb=o.onboarded?1:0;G.sex=o.pet.type=='hembra'?'f':'m';if(o.pet.type=='robot')G.kind='robot';if(['light','dark','retro'].includes(o.theme))G.theme=o.theme;
  const R=Array.isArray(o.routines)?o.routines:Object.values(o.routines||{}),H={};if(R[0]&&R[0].ejercicios)G.gym=R[0].ejercicios.map(e=>({n:e.nombre||e.name||'',s:+e.series||0,r:+e.reps||0,k:+e.peso||0}));
  R.forEach(r=>(r.ejercicios||[]).forEach(e=>(e.historial||[]).forEach(x=>(H[x.fecha]=H[x.fecha]||[]).push({n:e.nombre||'',s:+e.series||0,r:+e.reps||0,k:+x.peso||0}))));
  Object.keys(o.routineLog||{}).forEach(d=>{G.log[d]=1;H[d]=H[d]||[]});G.hist=Object.keys(H).sort().map(d=>({d,disc:'gym',ex:H[d]}))}catch(e){}}
/* ===== PROGRESS: weekly streak, consistency calendar, load history, achievements ===== */
const mon=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x};
function streak(){const W={};Object.keys(G.log).forEach(k=>W[dk(mon(k+'T00:00:00'))]=1);let c=0,x=mon(new Date());if(!W[dk(x)])x.setDate(x.getDate()-7);while(W[dk(x)]){c++;x.setDate(x.getDate()-7)}return c}
let PM=new Date();
function prog(){const L={};G.hist.forEach(h=>(h.ex||[]).forEach(e=>(L[e.n]=L[e.n]||[]).push(e.k)));
  const y=PM.getFullYear(),m=PM.getMonth(),first=new Date(y,m,1),sd=(first.getDay()+6)%7,nd=new Date(y,m+1,0).getDate(),td=today();let cells='';
  for(let i=0;i<sd;i++)cells+='<i class="day pad"></i>';
  for(let d=1;d<=nd;d++){const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),n=G.log[ds]||0;cells+=`<i class="day${n>1?' f2':n?' f':''}${ds==td?' today':''}" title="${ds}">${d}</i>`}
  const lb=PM.toLocaleDateString('es',{month:'long',year:'numeric'}),label=lb.charAt(0).toUpperCase()+lb.slice(1),st=streak(),tot=Object.values(G.log).reduce((a,b)=>a+b,0);
  $('pg').innerHTML=`<div class="tk"><b>Racha: ${st} semana${st==1?'':'s'} consecutiva${st==1?'':'s'}</b><small>Con una sesión por semana la racha sigue.</small></div>
<div class="tk"><div class="mh"><button id="pmPrev">‹</button><b>${label}</b><button id="pmNext">›</button></div><div class="cal">${DN.map(x=>'<i class="dow">'+x+'</i>').join('')}${cells}</div><small>${tot} sesiones · ${G.xp} XP · ${G.ach.length} logros</small></div>
<div class="tk"><b>Historial de cargas</b>${Object.keys(L).slice(0,8).map(n=>{const a=L[n],d=Math.round((a[a.length-1]-a[0])*10)/10;return`<div class="hr"><span>${esc(n)}</span><span>${a[a.length-1]} kg</span><span>${d>0?'+':''}${d} kg</span></div>`}).join('')||'<i>Registra pesas para ver tu progresión</i>'}</div>
<div class="tk"><b>Logros</b>${G.ach.slice(-8).reverse().map(a=>`<div>★ ${a.d.slice(5)} · ${esc(a.t)}</div>`).join('')||'<i>Sin logros todavía</i>'}</div>
<div class="tk"><b>Últimas sesiones</b>${G.hist.slice(-6).reverse().map(x=>`<div>${x.d.slice(5)} · ${TR[x.disc]} · ${esc(sum(x))}</div>`).join('')||'<i>Vacío</i>'}</div>`;
  $('pmPrev').onclick=()=>{PM.setMonth(PM.getMonth()-1);prog()};$('pmNext').onclick=()=>{PM.setMonth(PM.getMonth()+1);prog()}}
/* ===== ONBOARDING: name, sport focus and optional gender (species stays a surprise) ===== */
function onb(){['vt','vr','vp'].forEach(i=>i=='vt'?$(i).style.display='none':$(i).hidden=true);$('tabs').style.display='none';$('vo').hidden=false;
  $('vo').innerHTML=`<div class="tk"><b>¡Bienvenido a SUSTAMA!</b><p>Un huevo misterioso está a punto de eclosionar.</p><label>Nombre de tu mascota<input id="onm" maxlength="16" placeholder="Ej: Bestia, Alfa…"></label><b>Tu enfoque (uno o más)</b>${Object.keys(TR).map(k=>`<label class="ck"><input type="checkbox" value="${k}"${k=='gym'?' checked':''}>${TR[k]}</label>`).join('')}<b>Tipo</b><div class="row sm">${[['r','Sorpresa'],['m','Macho'],['f','Hembra'],['robot','Robot']].map(([v,l])=>`<label class="ck"><input type="radio" name="gen" value="${v}"${v=='r'?' checked':''}>${l}</label>`).join('')}</div><button class="pri" id="ogo">¡Eclosionar!</button></div>`;
  $('ogo').onclick=()=>{const n=$('onm').value.trim();if(!n){$('onm').focus();return}const ds=[...$('vo').querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);if(!ds.length)ds.push('gym');
    const gv=($('vo').querySelector('input[name=gen]:checked')||{}).value||'r',np=pickPet(gv);
    Object.assign(G,np,{name:n,xp:0,energy:100,water:Date.now(),onb:1,plan:{}});FC={};[1,3,5,2,4].slice(0,Math.max(3,Math.min(ds.length,5))).forEach((d,i)=>G.plan[d]=ds[i%ds.length]);G.days=Object.keys(G.plan).map(Number);TK.disc=ds[0];
    $('tabs').style.display='';save();tab('tama');ui();draw();E.from=1;start('evolve');say(['¡Hola! Soy '+n+'. ¡Vamos a entrenar juntos!'],'^')}}
/* ===== UI ===== */
function ui(){dots();const l=lvl(G.xp),nx=EVO[l];$('info').innerHTML='<b>'+G.name+'</b> · '+({robot:'Robot',cat:'Orejas',round:'Redondo',notch:'Muesca'}[G.kind])+(G.kind!='robot'?' · '+(G.sex=='m'?'Macho':'Hembra'):'')+' · Nv '+l+' · '+MOOD[mood()];
  $('xpt').textContent=G.xp+(nx?' / '+nx:' (máx)')+' · hoy '+G.xpToday+'/'+XPCAP;$('xpb').style.width=(nx?(G.xp-EVO[l-1])/(nx-EVO[l-1])*100:100)+'%';
  $('ent').textContent=Math.round(G.energy)+'%';$('enb').style.width=G.energy+'%';
  document.querySelectorAll('#days button').forEach(b=>b.classList.toggle('on',G.days.includes(+b.dataset.d)))}
function fit(){const a=Math.min($('app').clientWidth-6,480),d=devicePixelRatio||1,k=Math.max(2,Math.floor(a*d/128));$('sw').style.setProperty('--u',k/d+'px');$('cv').style.width=k*128/d+'px'}
function btn(p,t,fn,cls){const b=document.createElement('button');b.textContent=t;b.onclick=fn;if(cls)b.dataset.d=cls[0];p.append(b);return b}
btn($('tabs'),'Tama',()=>tab('tama'));btn($('tabs'),'Rutinas',()=>tab('reg'));btn($('tabs'),'Progreso',()=>tab('prog'));
const B={};B.play=btn($('acts'),'Jugar',()=>closeSub()&&act('play'));
B.train=btn($('acts'),'Entrenar',()=>openSub('train'));B.train.innerHTML='Entrenar<i class="dot"></i>';

B.cre=btn($('acts'),'00 Creatina',()=>closeSub()&&act('cre'));B.cre.classList.add('creBtn');

function closeSub(){subOpen=null;$('sub').className='row sm';$('sub').innerHTML='';return true}
function openSub(w){if(subOpen==w)return closeSub();subOpen=w;const s=$('sub');s.innerHTML='';s.className='row sm show';
  if(w=='train')for(const k in TR)btn(s,TR[k],()=>{closeSub();act(k)});
  else{btn(s,'Descansar',()=>{closeSub();act('rest')});btn(s,'Dar agua',()=>{closeSub();act('water')})}}

btn($('dev'),'Nueva mascota',()=>onb());

TK.disc=G.plan[new Date().getDay()]||'gym';setTheme(G.theme in TH?G.theme:'light');tab('tama');if(!G.onb)onb();mu();fit();ui();draw();setInterval(tick,TICK);E.tn=thirsty()?1:0;setTimeout(()=>{const n=needs();if(n.length&&G.onb)say(needMsgs(),n[0]=='want'?'o':'-')},500);
window.SUS={G,E,TK,tab,act,sfx,prog,onb,say,needs,setXP,form,draw,montage(){const m=document.createElement('canvas');m.width=250;m.height=215;const c=m.getContext('2d');c.fillStyle=C.bg;c.fillRect(0,0,250,215);E.st='idle';E.auto='stand';['cat','round','notch','robot'].forEach((k,i)=>[1,2,3,4].forEach(r=>{const fm=form(k,r);spr(c,fm,30+i*60,r*50-fm.foot,{})}));return m.toDataURL()}}})();
